<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenDeck Settings</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --accent: #6366f1;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --green: #22c55e;
      --orange: #f97316;
      --red: #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 32px 24px;
    }
    header { text-align: center; margin-bottom: 32px; }
    header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    header p { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .card {
      background: var(--surface);
      border-radius: 14px;
      padding: 20px 24px;
      width: 100%;
      max-width: 440px;
      margin-bottom: 16px;
    }
    .card h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px; }
    .status-row { display: flex; align-items: center; gap: 10px; font-size: 15px; }
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 9999px;
      font-size: 12px; font-weight: 600;
    }
    .badge.ready { background: rgba(34,197,94,0.18); color: var(--green); }
    .badge.waiting { background: rgba(249,115,22,0.18); color: var(--orange); }
    .badge.disconnected { background: rgba(239,68,68,0.12); color: var(--red); }
    .pin-display {
      font-size: 36px; font-weight: 800; letter-spacing: 12px;
      color: var(--accent); text-align: center; padding: 16px 0 8px;
    }
    .pin-hint { font-size: 12px; color: var(--muted); text-align: center; }
    .device-id { font-family: monospace; font-size: 13px; color: var(--text); }
    footer { margin-top: 24px; font-size: 11px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>OpenDeck</h1>
    <p>Desktop Companion Agent · macOS &amp; Windows</p>
  </header>

  <div class="card">
    <h2>Connection Status</h2>
    <div class="status-row">
      <span id="status-label">Loading...</span>
      <span id="status-badge" class="badge disconnected">Disconnected</span>
    </div>
  </div>

  <div class="card" id="pin-card" style="display:none">
    <h2>Pairing PIN</h2>
    <div class="pin-display" id="pin-value">----</div>
    <div class="pin-hint">Enter this code on your mobile device to pair</div>
  </div>

  <div class="card" id="perm-card" style="display:none">
    <h2>System Permissions</h2>
    <div class="status-row" style="justify-content: space-between;">
      <span>Accessibility (Input Injection)</span>
      <span id="perm-badge" class="badge disconnected">Missing</span>
    </div>
    <button id="perm-btn" onclick="requestPerm()" style="margin-top: 12px; padding: 8px 14px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; display: none;">Grant Permission</button>
  </div>

  <footer>OpenDeck v0.1.0 · MIT License · github.com/your-username/opendeck</footer>

  <script>
    const { invoke } = window.__TAURI__.core;

    async function refresh() {
      try {
        const state = await invoke('get_daemon_state');
        document.getElementById('status-label').textContent = state.statusLabel;

        const badge = document.getElementById('status-badge');
        badge.textContent = state.status;
        badge.className = 'badge ' + (
          state.status === 'Ready' ? 'ready' :
          state.status === 'Disconnected' ? 'disconnected' : 'waiting'
        );

        const pinCard = document.getElementById('pin-card');
        if (state.pairingPin) {
          pinCard.style.display = 'block';
          document.getElementById('pin-value').textContent = state.pairingPin;
        } else {
          pinCard.style.display = 'none';
        }

        const deviceCard = document.getElementById('device-card');
        if (state.pairedDeviceId) {
          deviceCard.style.display = 'block';
          document.getElementById('device-id').textContent = state.pairedDeviceId;
        } else {
          deviceCard.style.display = 'none';
        }
        const permCard = document.getElementById('perm-card');
        const permBadge = document.getElementById('perm-badge');
        const permBtn = document.getElementById('perm-btn');

        if (state.accessibilityGranted !== undefined) {
          permCard.style.display = 'block';
          if (state.accessibilityGranted) {
            permBadge.textContent = 'Granted';
            permBadge.className = 'badge ready';
            permBtn.style.display = 'none';
          } else {
            permBadge.textContent = 'Missing';
            permBadge.className = 'badge disconnected';
            permBtn.style.display = 'inline-block';
          }
        }
      } catch (e) {
        console.error('State fetch failed:', e);
      }
    }

    async function requestPerm() {
      await invoke('request_accessibility');
      refresh();
    }

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
