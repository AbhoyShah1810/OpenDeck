[package]
name = "opendeck-desktop"
version = "0.1.0"
description = "OpenDeck Desktop Companion Agent - BLE GATT Peripheral & Macro Automation Daemon"
authors = ["OpenDeck Contributors"]
license = "MIT"
repository = "https://github.com/your-username/opendeck"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
# Input automation — synthetic keyboard / mouse / media events
enigo = { version = "0.6.1", default-features = false }
# Shell execution sandboxing
shell-words = "1.1"
# System metrics for telemetry (CPU / RAM)
sysinfo = { version = "0.35", default-features = false, features = ["system"] }
# OBS Studio WebSocket client
tokio-tungstenite = "0.26"
futures-util = "0.3"

# ── macOS CoreBluetooth GATT Peripheral & Security ───────────────────────────
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-bluetooth = { version = "0.3.2" }
objc2-foundation = { version = "0.3.2", features = [
  "NSArray",
  "NSData",
  "NSDictionary",
  "NSObject",
  "NSString",
  "NSUUID",
] }
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace", "NSRunningApplication"] }
objc2 = { version = "0.6.4" }
dispatch2 = "0.3.1"
core-foundation = "0.10"

# ── Windows WinRT GATT Server ─────────────────────────────────────────────────
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Devices_Bluetooth",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Devices_Bluetooth_Advertisement",
  "Foundation_Collections",
  "Storage_Streams",
] }

[dev-dependencies]
tempfile = "3"

