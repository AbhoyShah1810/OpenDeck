[package]
name = "opendeck-desktop"
version = "0.1.0"
description = "OpenDeck Desktop Companion Agent - BLE GATT Peripheral & Macro Automation Daemon"
authors = ["OpenDeck Contributors"]
license = "MIT"
repository = "https://github.com/your-username/opendeck"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
